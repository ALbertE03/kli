<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="KLI — espacio de trabajo unificado para modelos de lenguaje." />
    <link rel="icon" type="image/svg+xml" href="./kli.svg" />
    <title>KLI</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('kli-studio-storage');
          var theme = raw ? JSON.parse(raw).state?.theme : undefined;
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
