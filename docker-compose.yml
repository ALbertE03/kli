services:
  api:
    build: .
    env_file: .env
    environment:
      # Rutas internas del contenedor (si tu .env usa ./data, etc., aquí se ajustan)
      DATA_DIR: /app/data
      WORKSPACE_DIR: /app/workspace
      PROJECTS_DIR: /app/projects
      # Desde aquí se pueden importar carpetas existentes del host
      # (monta la carpeta que quieras usar en /import o en /host, ver volúmenes)
      PROJECTS_IMPORT_ROOTS: /import,/app/workspace,/host
      # Sin proveedores locales hardcodeados: openai y anthropic son built-in y los
      # demás (ej. freellmapi) se registran por API contra host.docker.internal:
      #   POST /api/v1/providers  {"name":"freellmapi","kind":"openai",
      #                            "base_url":"http://host.docker.internal:31415/v1"}
      # Si prefieres fijarlos por entorno, usa OPENAI_BASE_URL en .env.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # TODO lo que hace el harness queda en el host, no dentro del contenedor
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./projects:/app/projects
      # el código en vivo: edita src/ y recarga con `make dev` o reinicia el compose
      - ./src:/app/src
      - ./README.md:/app/README.md:ro
      # tu HOME del host montada en /host: así puedes importar cualquier carpeta
      # que tengas con `/project import <nombre> /host/mis-repos`
      # (cámbialo con KLI_HOST_DIR=/ruta/que/quieras docker compose up)
      - ${KLI_HOST_DIR:-${HOME}}:/host
      # para importar carpetas concretas en /import:
      # - ~/mis-repos:/import/mis-repos
    stdin_open: true
    tty: true
    restart: unless-stopped

  # El TUI dentro del contenedor: `docker compose run --rm cli`
  # (usa el mismo código y los mismos volúmenes que la API)
  cli:
    build: .
    profiles: ["cli"]
    entrypoint: ["kliccode"]
    command: []
    environment:
      KLI_API_URL: http://api:8000
      KLI_USER: ${KLI_USER:-anonymous}
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./projects:/app/projects
      - ./src:/app/src
      - ${KLI_HOST_DIR:-${HOME}}:/host
    stdin_open: true
    tty: true
