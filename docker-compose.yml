services:
  api:
    build:
      context: .
      args:
        # Pon INCLUDE_NODE=true si vas a usar servidores MCP por stdio (npx, uvx)
        INCLUDE_NODE: "false"
        UV_VERSION: "0.5.30"
    env_file: .env
    environment:
      # Rutas internas del contenedor
      DATA_DIR: /app/data
      WORKSPACE_DIR: /app/workspace
      PROJECTS_DIR: /app/projects
      # Raíces desde las que se puede importar una carpeta existente
      PROJECTS_IMPORT_ROOTS: /import,/app/workspace,/host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Persistencia en el host
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./projects:/app/projects
      # Código en vivo (para desarrollo)
      - ./src:/app/src
      - ./README.md:/app/README.md:ro
      # Tu HOME del host montada en /host: así puedes importar cualquier carpeta
      # con `/project import <nombre> /host/mis-repos`
      # (cámbialo con KLI_HOST_DIR=/ruta/que/quieras docker compose up)
      - ${KLI_HOST_DIR:-${HOME}}:/host
      # Para importar carpetas concretas en /import:
      # - ~/mis-repos:/import/mis-repos
    stdin_open: true
    tty: true
    restart: unless-stopped

  # El TUI dentro del contenedor: `docker compose run --rm cli`
  # (usa el mismo código y los mismos volúmenes que la API)
  cli:
    build:
      context: .
      args:
        INCLUDE_NODE: "false"
        UV_VERSION: "0.5.30"
    profiles: ["cli"]
    entrypoint: ["klicode"]
    command: []
    environment:
      KLI_API_URL: http://api:8000
      KLI_USER: ${KLI_USER:-anonymous}
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./projects:/app/projects
      - ./src:/app/src
      - ${KLI_HOST_DIR:-${HOME}}:/host
    stdin_open: true
    tty: true